name: Docs Quality

# Reusable + self-triggering.
# - Runs directly on this (.github) repo on push/PR.
# - Can be called by any org repo via `uses: aicloud-consulting/.github/.github/workflows/docs-quality.yml@main`.
# Shared tooling (markdownlint rules + frontmatter validator) is fetched from this public repo
# into RUNNER_TEMP so it is never part of the linted/validated workspace.
on:
  workflow_call: {}
  pull_request:
    branches: [main]
    paths: ["**.md", "**.yml", "**.yaml"]
  push:
    branches: [main]
    paths: ["**.md", "**.yml", "**.yaml"]

jobs:
  docs-quality:
    name: Docs Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml jsonschema

      - name: Fetch shared DaC tooling from .github (public)
        run: |
          base="https://raw.githubusercontent.com/aicloud-consulting/.github/main"
          # Retry so a transient raw.githubusercontent.com blip does not fail the whole gate.
          retry="--retry 5 --retry-delay 2 --retry-all-errors"
          curl -fsSL $retry "$base/.markdownlint.yml" -o "$RUNNER_TEMP/.markdownlint.yml"
          curl -fsSL $retry "$base/.github/scripts/validate-frontmatter.py" -o "$RUNNER_TEMP/validate-frontmatter.py"
          mkdir -p "$RUNNER_TEMP/schemas"
          for s in frontmatter.schema.json case-study.schema.json core-offer.schema.json; do
            curl -fsSL $retry "$base/schemas/$s" -o "$RUNNER_TEMP/schemas/$s"
          done

      - name: Markdown lint
        # The caller repo's own .markdownlint-cli2.jsonc (if present) supplies `ignores`.
        run: npx -y markdownlint-cli2 --config "$RUNNER_TEMP/.markdownlint.yml" "**/*.md"

      - name: Frontmatter validation
        run: python "$RUNNER_TEMP/validate-frontmatter.py" --schema-dir "$RUNNER_TEMP/schemas"

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          # lychee >=0.15 does not check mail links by default, so the old
          # `--exclude-mail` flag was removed and now errors as an unknown arg.
          args: >-
            --verbose --no-progress
            --exclude '^https://github\.com/aicloud-consulting/.*'
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
