name: "🏆 Case Study / Evidence Request"
description: "Request the creation or update of a Case Study or technical evidence for commercial use."
title: "[EVIDENCE REQUEST] "
labels: ["documentation", "case-study", "go-to-market"]
assignees: ["personal-abrahamchavez"]
body:
  - type: markdown
    attributes:
      value: |
        ## Case Study / Technical Evidence Request
        Every Case Study must be **fully anonymized** before being published in any external channel. The real client is never mentioned; they are described by sector/scale/industry. This policy is non-negotiable (NDA compliance).

  - type: dropdown
    id: type
    attributes:
      label: "Evidence Type"
      options:
        - "New Case Study (from a founder's experience)"
        - "Update to an existing Case Study"
        - "Reference Architecture (technical diagram)"
        - "Business impact metric for Sales Deck"
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: "Source founder"
      placeholder: "e.g. Abraham Chávez / Ceury"
    validations:
      required: true

  - type: textarea
    id: raw_experience
    attributes:
      label: "Raw experience (pre-anonymization)"
      description: "Describe the real project: client, challenge, solution, impact. This field is INTERNAL — it never leaves the private repository."
    validations:
      required: true

  - type: textarea
    id: target_audience
    attributes:
      label: "Target audience for the case study"
      description: "For which pitch / vertical / stakeholder will this be used? (e.g. CTO of a manufacturing company, CISO of a bank)"
    validations:
      required: true

  - type: dropdown
    id: lang
    attributes:
      label: "Delivery language"
      options:
        - "es-MX"
        - "en-US"
        - "Bilingual (es-MX + en-US)"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Anonymization Checklist"
      options:
        - label: "No real client name will appear in the published version."
          required: true
        - label: "The client is described by sector/industry/scale (e.g. 'global leader in the baking industry')."
          required: true
        - label: "No exact dates or data that could triangulate the client's identity."
          required: true
        - label: "Complies with the NDA signed with the original client."
          required: true
