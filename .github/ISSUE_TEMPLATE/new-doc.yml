name: "📄 New Document"
description: "Request the creation of a new document in the Docs as Code system."
title: "[NEW DOC] "
labels: ["documentation", "new"]
assignees: ["personal-abrahamchavez"]
body:
  - type: markdown
    attributes:
      value: |
        ## New Document Request
        Please fill out all fields. Remember: **Zero Improvisation** — every document must have a defined purpose, owner, and traceability before creation.

  - type: input
    id: title
    attributes:
      label: "Document title"
      placeholder: "e.g. Identity and Access Management Policy (IAM)"
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: "Target repository"
      placeholder: "e.g. core-target-repo"
      description: "Enter the specific private or public repository name."
    validations:
      required: true

  - type: input
    id: folder
    attributes:
      label: "Target folder inside the repo"
      placeholder: "e.g. docs/ | engineering/ | architecture/"
    validations:
      required: true

  - type: dropdown
    id: lang
    attributes:
      label: "Language"
      options:
        - "es-MX"
        - "en-US"
        - "Bilingual (es-MX + en-US)"
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: "Document Owner (GitHub login)"
      placeholder: "e.g. personal-abrahamchavez"
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: "Purpose and Context"
      description: "What problem does this solve? Who is the target audience (internal / client / legal)?"
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: "Source document (if applicable)"
      description: "Relative path in Google Drive if this is a migration. Leave empty if it's new."
      placeholder: "G:/My Drive/A&C/[filename].md"

  - type: checkboxes
    id: checklist
    attributes:
      label: "Pre-flight Checklist"
      options:
        - label: "I verified that a similar document does not already exist in the repo."
          required: true
        - label: "The document has an assigned owner."
          required: true
        - label: "It complies with the Information Classification Policy (PMSI)."
          required: true
