name: "🗄️ Deprecar / Archivar Documento"
description: "Solicitar la baja, archivado o marcado como 'superseded' de un documento."
title: "[DEPRECATION] "
labels: ["documentation", "deprecation"]
assignees: ["personal-abrahamchavez"]
body:
  - type: markdown
    attributes:
      value: |
        ## Solicitud de Depreciación Documental
        Un documento deprecado **nunca se elimina** del historial Git; solo cambia su `status` en el frontmatter a `superseded` o `archived` y se mueve a una carpeta `_archived/` si corresponde.

  - type: input
    id: doc_path
    attributes:
      label: "Path del documento a deprecar"
      placeholder: "ej. core-corporate-governance/governance/term-sheet-v1.md"
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: "Tipo de acción"
      options:
        - "superseded — reemplazado por una versión nueva"
        - "archived — ya no aplica, se conserva como histórico"
        - "deleted — eliminar por completo (requiere aprobación Owner)"
    validations:
      required: true

  - type: input
    id: replacement
    attributes:
      label: "Documento que lo reemplaza (si aplica)"
      placeholder: "ej. core-corporate-governance/governance/term-sheet-v2.md"

  - type: textarea
    id: reason
    attributes:
      label: "Motivo de la deprecación"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "Documentos o procesos que referencian este doc"
      description: "Listar para actualizar referencias antes de deprecar."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "Se notificó al owner del documento"
          required: true
        - label: "Se identificaron y actualizarán todas las referencias al documento"
          required: true
        - label: "El documento nuevo (si aplica) ya está en estado `approved`"
          required: true
