name: "🗄️ Deprecate / Archive Document"
description: "Request to sunset, archive, or mark a document as 'superseded'."
title: "[DEPRECATION] "
labels: ["documentation", "deprecation"]
assignees: ["personal-abrahamchavez"]
body:
  - type: markdown
    attributes:
      value: |
        ## Document Deprecation Request
        A deprecated document is **never deleted** from Git history; it only changes its frontmatter `status` to `superseded` or `archived` and is moved to an `_archived/` folder if applicable.

  - type: input
    id: doc_path
    attributes:
      label: "Path of the document to deprecate"
      placeholder: "e.g. target-repo/folder/document-name-v1.md"
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: "Action Type"
      options:
        - "superseded — replaced by a newer version"
        - "archived — no longer applicable, kept for historical record"
        - "deleted — permanently delete (requires Owner approval)"
    validations:
      required: true

  - type: input
    id: replacement
    attributes:
      label: "Replacement Document (if applicable)"
      placeholder: "e.g. target-repo/folder/document-name-v2.md"

  - type: textarea
    id: reason
    attributes:
      label: "Reason for deprecation"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "Documents or processes referencing this doc"
      description: "List them here so references can be updated before deprecation."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "The document owner has been notified."
          required: true
        - label: "All references to the document have been identified and will be updated."
          required: true
        - label: "The new document (if applicable) is already in an `approved` state."
          required: true
