name: "✏️ Update Document"
description: "Request an update or correction to an existing document."
title: "[UPDATE DOC] "
labels: ["documentation", "update"]
assignees: ["personal-abrahamchavez"]
body:
  - type: markdown
    attributes:
      value: |
        ## Document Update Request
        Document exactly what changes, why, and what the impact is. Traceability is mandatory.

  - type: input
    id: doc_path
    attributes:
      label: "Path of the document to update"
      placeholder: "e.g. core-corporate-governance/policies/pmsi.md"
    validations:
      required: true

  - type: textarea
    id: what_changes
    attributes:
      label: "What changes? (The Context)"
      description: "Describe the specific changes. Be precise."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: "Why does it change? (The Solution)"
      description: "Reason for the change: new regulation, operational change, correction, etc."
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "What dependencies does it affect? (The Impact)"
      description: "What other documents, processes, or teams are affected?"
    validations:
      required: true

  - type: input
    id: source_updated
    attributes:
      label: "Was the source document in Google Drive updated?"
      description: "Indicate whether the origin was modified or if this is the live DaC document."
      placeholder: "Yes / No / Not applicable"

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "The `last_review` field in the frontmatter will be updated to today's date."
          required: true
        - label: "Dependent documents have been notified or updated."
          required: true
