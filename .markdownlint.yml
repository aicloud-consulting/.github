# markdownlint configuration — A&C Consulting Services
# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Default: enable all rules, then override below
default: true

# MD013 — Line length: disable (we write prose docs, not code)
MD013: false

# MD033 — Inline HTML: allow (used for underline in CVs and emphasis)
MD033: false

# MD041 — First line should be top-level heading: disable for frontmatter docs
MD041: false

# MD024 — Multiple headings with the same content: allow (e.g. repeated "Impacto")
MD024: false

# MD036 — Emphasis used as a heading: disable (used for bold labels in docs)
MD036: false

# MD060 — Table column style: disable. A&C house style uses padded pipes
# (`| cell |`) consistently across all repos; this rule (added in newer
# markdownlint, not present in the pinned CI action) would demand the opposite.
MD060: false

# MD025 — Single H1: every A&C content doc carries a YAML frontmatter `title:`
# AND a body `# H1` (the visible title). Tell MD025 NOT to treat the frontmatter
# title as a heading, so a single body H1 is valid. (Multiple body H1s still fail.)
MD025:
  front_matter_title: ""
